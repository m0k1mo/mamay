# Brush Lab in the cloud (M2, Artem 03.11: the Mac stays home; the Brush Artist must still create brushes and see what works).
# A GitHub Mac paints every brush of Mamay — the 15 tuned presets, the 23 techniques of 0.45, the erasers — and every Brush
# Artist pack in brush-lab/packs/*.json with the same ten strokes on the CPU reference of Mamay's paint engine, and publishes
# a sheet per brush, numbers.json and report.md on the branch `brush-lab-out` (public: raw.githubusercontent.com/m0k1mo/mamay/
# brush-lab-out/report.md). Runs when a pack is pushed, by hand (only some brushes, or only the packs), and from the lead.
name: Brush Lab

on:
  push:
    branches: [main]
    paths: ['brush-lab/packs/**']
  schedule:
    - cron: '17 */2 * * *'   # every 2 hours: new packs from the Brush Artist's Drive folder (brush-lab/drive-folder.txt)
  workflow_dispatch:
    inputs:
      ref:
        description: commit or branch of m0k1mo/Formlab
        default: native/lead-0111
      only:
        description: only these brushes (names, comma-separated; empty = all)
        default: ''
      packs_only:
        description: only the Brush Artist's packs
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: brush-lab
  cancel-in-progress: false

jobs:
  drive:
    # cheap: a Linux box looks at the Drive folder; the Mac starts only when there is something to paint
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.drive.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: mamay
      - name: Packs from the Brush Artist's Drive folder
        id: drive
        working-directory: mamay
        run: |
          set -eo pipefail
          echo "changed=0" >> "$GITHUB_OUTPUT"
          F=$(grep -v '^#' brush-lab/drive-folder.txt 2>/dev/null | head -1 | tr -d '[:space:]' || true)
          [ -n "$F" ] || { echo "no Drive folder link — packs come by push only"; exit 0; }
          python3 -m pip install -q --user gdown >/dev/null 2>&1 || pip3 install -q gdown
          rm -rf /tmp/drive && mkdir -p /tmp/drive
          python3 -m gdown --folder "$F" -O /tmp/drive --quiet || { echo "the Drive folder is not readable (is it shared «anyone with the link»?)"; exit 0; }
          for f in $(find /tmp/drive -name '*.json'); do
            id=$(python3 -c "import json,sys;d=json.load(open(sys.argv[1]));assert isinstance(d['id'],str) and isinstance(d['version'],int) and isinstance(d['brushes'],list);print(d['id'])" "$f" 2>/dev/null) || { echo "skip $(basename "$f"): not a pack"; continue; }
            python3 -c "import json,sys;json.dump(json.load(open(sys.argv[1])),open(sys.argv[2],'w'),ensure_ascii=False,indent=1)" "$f" /tmp/pack.json
            if ! cmp -s /tmp/pack.json "brush-lab/packs/$id.json"; then cp /tmp/pack.json "brush-lab/packs/$id.json"; echo "new: $id"; echo "changed=1" >> "$GITHUB_OUTPUT"; fi
          done
          if git status --porcelain brush-lab/packs | grep -q .; then
            git add brush-lab/packs
            git -c user.name="brush-lab" -c user.email="brush-lab@users.noreply.github.com" commit -qm "Brush Lab: packs from the Brush Artist's Drive folder"
            git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:main
          fi

  where:
    # Artem 03.11: his Mac when it is online, GitHub's Mac only when it is not (scripts/which-mac.sh pings it)
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    outputs:
      runner: ${{ steps.r.outputs.runner }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}   # actions: write — which-mac.sh pings the Mac (mac-ping.yml)
        run: |
          R=""
          if [ -z "$R" ]; then
            R=$(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/which-mac.sh" | bash)
          fi
          echo "runner=$R" >> "$GITHUB_OUTPUT"; echo "→ $R"
  lab:
    needs: [drive, where]
    if: github.event_name != 'schedule' || needs.drive.outputs.changed == '1'
    runs-on: ${{ needs.where.outputs.runner == 'artem-mac' && fromJSON('["self-hosted","artem-mac"]') || needs.where.outputs.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: mamay
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: m0k1mo/Formlab
          ref: ${{ github.event.inputs.ref || 'native/lead-0111' }}
          token: ${{ secrets.FORMLAB_CODE_TOKEN }}
          path: src
      - name: Paint every brush
        working-directory: src/native
        env:
          ONLY: ${{ github.event.inputs.only }}
          PACKS_ONLY: ${{ github.event.inputs.packs_only }}
        run: |
          set -eo pipefail
          xcodebuild -downloadComponent MetalToolchain >/dev/null 2>&1 || true
          swift build -c release --product brushlab > build.log 2>&1 || { grep -E "error" build.log | grep -v "^Failed frontend" | cut -c1-400 | head -40; exit 1; }
          rm -rf "$GITHUB_WORKSPACE/out"
          A=(--out "$GITHUB_WORKSPACE/out" --packs "$GITHUB_WORKSPACE/mamay/brush-lab/packs" --url-prefix "")
          [ -n "$ONLY" ] && A+=(--only "$ONLY")
          [ "$PACKS_ONLY" = "true" ] && A+=(--packs-only)
          "$(swift build -c release --show-bin-path)/brushlab" "${A[@]}"
      - name: Publish on brush-lab-out
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf pub   # Artem's Mac keeps its workspace between runs
          git clone -q --depth 1 -b brush-lab-out "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pub 2>/dev/null || {
            git init -q pub && cd pub && git checkout -q --orphan brush-lab-out && cd ..; }
          cd pub
          # a partial run (only some brushes) keeps the other sheets; the report and numbers are of this run
          cp -f ../out/*.png . 2>/dev/null || true
          cp -f ../out/report.md ../out/numbers.json .
          printf '%s\n' "${{ github.sha }} $(date -u +%FT%TZ) run ${{ github.run_number }}" > LAST_RUN
          git add -A
          git -c user.name="brush-lab" -c user.email="brush-lab@users.noreply.github.com" commit -qm "Brush Lab run ${{ github.run_number }}" || exit 0
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:brush-lab-out
