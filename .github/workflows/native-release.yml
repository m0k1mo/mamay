# Mamay Native — publish a test build for Artem (ROAD §7.1–7.3).
# Artem 02.11, 00:33: «не хочу постійно бігати і нажимати кнопки, максимум кнопка оновити програму» — so the lead publishes test builds
# himself by pushing native-release-queue/next.json ({"version","ref","notes"}); Artem only presses Update inside the Tester.
# Run workflow by hand still works. The real (non-test) release stays only after Artem's «так».
# Builds from the private code at `ref`, ad-hoc signs, makes DMGs for the Mac app and the Tester and an unsigned .ipa for iPad
# (installed with Sideloadly / AltStore / SideStore under a free Apple ID), and publishes a PRERELEASE `native-v<version>` here.
# The 0.45 channel (`v0.45.x`, latest.json) is not touched: Native is a new app installed next to it.
name: Native release

on:
  push:
    branches: [main]
    paths: ['native-release-queue/*.json']
  workflow_dispatch:
    inputs:
      ref:
        description: commit or branch of m0k1mo/Formlab
        default: native/lead-0111
      version:
        description: version, e.g. 0.1.0
        required: true
        default: 0.1.1-test
      notes:
        description: release notes (Ukrainian, plain words for Artem)
        default: "ТЕСТОВА збірка Mamay Native + Mamay Tester (аркуші ще не ідеальні — це для тестів, не для роботи). Тестер: Start — перевіряє все по черзі, Pause — зупиняє, звіти самі йдуть на Google Диск «Formlab Reports / Mamay Native». Нові збірки тепер приходять у самому Тестері — кнопка Update."
      runner:
        description: where to build (empty = Artem's Mac when online, else GitHub)
        type: choice
        options: ['', artem-mac, xcode-27]
        default: ''
        required: false

permissions:
  contents: write

jobs:
  where:
    # Artem 03.11: his Mac when it is online, GitHub's Mac only when it is not (scripts/which-mac.sh pings it)
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    outputs:
      runner: ${{ steps.r.outputs.runner }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}   # actions: write — which-mac.sh pings the Mac (mac-ping.yml)
        run: |
          R="${{ github.event.inputs.runner }}"
          if [ -z "$R" ] && [ "${{ github.event_name }}" = push ]; then   # the queue file may name it: {"runner": "xcode-27"}
            R=$(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/native-release-queue/next.json" \
                | python3 -c "import json,sys;print(json.load(sys.stdin).get('runner',''))" || true)
          fi
          if [ -z "$R" ]; then
            R=$(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/which-mac.sh" | bash)
          fi
          echo "runner=$R" >> "$GITHUB_OUTPUT"; echo "→ $R"
  release:
    needs: where
    runs-on: ${{ needs.where.outputs.runner }}
    timeout-minutes: 60
    steps:
      - name: What to build
        id: p
        env:
          IN_REF: ${{ github.event.inputs.ref }}
          IN_V: ${{ github.event.inputs.version }}
          IN_NOTES: ${{ github.event.inputs.notes }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            curl -fsSL "https://raw.githubusercontent.com/$REPO/$SHA/native-release-queue/next.json" -o q.json
            IN_REF=$(python3 -c "import json;print(json.load(open('q.json')).get('ref','native/lead-0111'))")
            IN_V=$(python3 -c "import json;print(json.load(open('q.json'))['version'])")
            IN_NOTES=$(python3 -c "import json;print(json.load(open('q.json')).get('notes',''))")
          fi
          [ -n "$IN_V" ] || { echo "no version — nothing to publish"; exit 1; }
          [ -n "$IN_NOTES" ] || IN_NOTES="ТЕСТОВА збірка Mamay Native + Mamay Tester (для тестів, не для роботи). Нові збірки приходять у самому Тестері — кнопка Update."
          echo "ref=$IN_REF" >> "$GITHUB_OUTPUT"; echo "version=$IN_V" >> "$GITHUB_OUTPUT"
          { echo "notes<<EOF_NOTES"; echo "$IN_NOTES"; echo "EOF_NOTES"; } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: m0k1mo/Formlab
          ref: ${{ steps.p.outputs.ref }}
          token: ${{ secrets.FORMLAB_CODE_TOKEN }}
          path: src
      - name: Tools
        run: |
          brew install xcodegen create-dmg >/dev/null 2>&1 || brew install xcodegen create-dmg
          xcodebuild -downloadComponent MetalToolchain >/dev/null 2>&1 || true
      - name: Build
        working-directory: src/native
        env:
          V: ${{ steps.p.outputs.version }}
        run: |
          set -eo pipefail
          sed -i '' "s/MARKETING_VERSION: \".*\"/MARKETING_VERSION: \"$V\"/; s/CURRENT_PROJECT_VERSION: \".*\"/CURRENT_PROJECT_VERSION: \"${{ github.run_number }}\"/" project.yml
          sh scripts/fingerprints.sh   # what this build is made of: progress in the Tester is kept by these, not by the version
          xcodegen generate --quiet
          APPS="Mamay-Mac MamayTester-Mac"; grep -q "MamayParser-Mac:" project.yml && APPS="$APPS MamayParser-Mac"
          for s in $APPS; do
            xcodebuild -project MamayNative.xcodeproj -scheme "$s" -configuration Release -destination 'generic/platform=macOS' \
              -derivedDataPath dd CODE_SIGN_IDENTITY=- build | tail -3
          done
          xcodebuild -project MamayNative.xcodeproj -scheme Mamay-iPad -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath dd CODE_SIGNING_ALLOWED=NO build | tail -3
      - name: Package
        working-directory: src/native
        env:
          V: ${{ steps.p.outputs.version }}
        run: |
          set -eo pipefail
          # on Artem's Mac: no Finder windows while the DMG is made (create-dmg would open one to lay out the icons)
          SKIP=""; [ "${{ needs.where.outputs.runner }}" = "artem-mac" ] && SKIP="--skip-jenkins"
          rm -rf ../../out Payload
          mkdir -p ../../out
          M=dd/Build/Products/Release
          codesign --force --deep -s - "$M/Mamay Native.app"
          codesign --force --deep -s - "$M/Mamay Native Tester.app"
          create-dmg $SKIP --volname "Mamay Native $V" --app-drop-link 420 160 --window-size 600 320 --icon "Mamay Native.app" 160 160 \
            "../../out/Mamay-Native-$V.dmg" "$M/Mamay Native.app" || hdiutil create -volname "Mamay Native" -srcfolder "$M/Mamay Native.app" -ov -format UDZO "../../out/Mamay-Native-$V.dmg"
          create-dmg $SKIP --volname "Mamay Tester $V" --app-drop-link 420 160 --window-size 600 320 --icon "Mamay Native Tester.app" 160 160 \
            "../../out/Mamay-Native-Tester-$V.dmg" "$M/Mamay Native Tester.app" || hdiutil create -volname "Mamay Tester" -srcfolder "$M/Mamay Native Tester.app" -ov -format UDZO "../../out/Mamay-Native-Tester-$V.dmg"
          if [ -d "$M/Mamay Parser.app" ]; then   # Mamay Parser (from 0.1.9)
            codesign --force --deep -s - "$M/Mamay Parser.app"
            create-dmg $SKIP --volname "Mamay Parser $V" --app-drop-link 420 160 --window-size 600 320 --icon "Mamay Parser.app" 160 160 \
              "../../out/Mamay-Parser-$V.dmg" "$M/Mamay Parser.app" || hdiutil create -volname "Mamay Parser" -srcfolder "$M/Mamay Parser.app" -ov -format UDZO "../../out/Mamay-Parser-$V.dmg"
          fi
          I=dd/Build/Products/Release-iphoneos
          mkdir -p Payload && cp -R "$I/Mamay.app" Payload/ && ditto -c -k --keepParent Payload "../../out/Mamay-Native-iPad-$V.ipa"
          ls -la ../../out
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.p.outputs.version }}
        run: |
          # Artem's Mac has no GitHub CLI yet — install it once (brew is there: the Tools step uses it)
          command -v gh >/dev/null 2>&1 || brew install gh >/dev/null 2>&1 || brew install gh
          # a second run of the same version (e.g. one left waiting on GitHub) does not publish twice
          if gh release view "native-v$V" --repo ${{ github.repository }} >/dev/null 2>&1; then echo "native-v$V is already out"; exit 0; fi
          gh release create "native-v$V" out/* --repo ${{ github.repository }} --prerelease --title "Mamay Native $V" \
            --notes "${{ steps.p.outputs.notes }}

          **Як поставити на Мак:** відкрий DMG → перетягни Mamay Native у Applications → перший раз: правий клік → Open, потім System Settings → Privacy & Security → Open Anyway. Поставиться поруч із Mamay 0.45 і нічого в ній не змінить.
          **Тестер:** так само з другого DMG; далі — Start. Наступні збірки — кнопка Update у Тестері.
          **iPad:** .ipa ставиться через Sideloadly (безкоштовний Apple ID), раз на 7 днів."
