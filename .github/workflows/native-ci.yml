# Mamay Native — build and test on GitHub macOS (ROAD §7.1). Started by m0k1mo/Formlab (push to native/** → repository_dispatch)
# or by hand (Run workflow). The code is private: it is checked out with FORMLAB_CODE_TOKEN; nothing from it stays here.
# Reports (test summary, first errors) are pushed to the PRIVATE repo, branch native-ci-reports — never published here.
name: Native CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: branch, tag or commit of m0k1mo/Formlab
        default: native/main
  repository_dispatch:
    types: [native-ci]

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.event.inputs.ref || github.event.client_payload.ref || 'native/main' }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [artem-mac, xcode-27, macos-26]   # artem-mac = Artem's M5 (self-hosted, fast path); GitHub runners = fallback + iPad + Swift 6.3
    runs-on: ${{ matrix.runner == 'artem-mac' && fromJSON('["self-hosted","artem-mac"]') || matrix.runner }}
    timeout-minutes: 60
    env:
      REF: ${{ github.event.inputs.ref || github.event.client_payload.ref || 'native/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: m0k1mo/Formlab
          ref: ${{ env.REF }}
          token: ${{ secrets.FORMLAB_CODE_TOKEN }}
          path: src
          lfs: false
      - name: Tools
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodebuild -downloadComponent MetalToolchain >/dev/null 2>&1 || true
          { sw_vers; xcodebuild -version; swift --version; } > env.txt 2>&1
      - name: Golden baseline (the last native/main of this runner)
        env:
          TOKEN: ${{ secrets.FORMLAB_CODE_TOKEN }}
        run: |
          # the golden ratchet: no sheet may get worse than on the last green native/main (GoldenRatchet in MamayScene tests)
          curl -fsSL -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/m0k1mo/Formlab/contents/native-ci/golden-last-${{ matrix.runner }}.json?ref=native-ci-reports" \
            -o golden-last.json && echo "baseline: $(wc -c < golden-last.json) bytes" || { rm -f golden-last.json; echo "no baseline yet"; }
      - name: Swift tests (packages)
        id: tests
        working-directory: src/native
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci-out"
          # on Artem's Mac: lowest priority (his apps first) and no sleep while building
          W=""; [ "${{ matrix.runner }}" = artem-mac ] && W="caffeinate -i"   # Artem 02.11, 11:58: the Mac at full power for builds
          GL=""; [ -f "$GITHUB_WORKSPACE/golden-last.json" ] && GL="$GITHUB_WORKSPACE/golden-last.json"
          MAMAY_GOLDEN_LAST="$GL" MAMAY_CI_OUT="$GITHUB_WORKSPACE/ci-out" $W swift test -c release -Xswiftc -enable-testing 2>&1 | tee ../../test.log
        continue-on-error: true
      - name: Build apps
        id: apps
        working-directory: src/native
        run: |
          set -o pipefail
          xcodegen generate --quiet
          ok=1
          W=""; [ "${{ matrix.runner }}" = artem-mac ] && W="caffeinate -i"   # Artem 02.11, 11:58: the Mac at full power for builds
          APPS="Mamay-Mac MamayTester-Mac"; grep -q "MamayParser-Mac:" project.yml && APPS="$APPS MamayParser-Mac"
          for s in $APPS; do
            $W xcodebuild -project MamayNative.xcodeproj -scheme "$s" -configuration Release -destination 'generic/platform=macOS' \
              -derivedDataPath dd CODE_SIGN_IDENTITY=- build > "../../build-$s.log" 2>&1 || ok=0
          done
          # iPad needs the iOS platform (~8 GB) — built on GitHub runners only
          [ "${{ matrix.runner }}" = artem-mac ] || xcodebuild -project MamayNative.xcodeproj -scheme Mamay-iPad -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath dd CODE_SIGNING_ALLOWED=NO build > ../../build-Mamay-iPad.log 2>&1 || ok=0
          [ $ok = 1 ]
        continue-on-error: true
      - name: Package (xcode-27 only)
        if: matrix.runner == 'xcode-27' && steps.apps.outcome == 'success'
        working-directory: src/native
        run: |
          mkdir -p ../../out
          P=dd/Build/Products/Release
          ditto -c -k --keepParent "$P/Mamay Native.app" "../../out/Mamay-Native-mac.zip"
          ditto -c -k --keepParent "$P/Mamay Native Tester.app" "../../out/Mamay-Native-Tester-mac.zip"
          ls -la ../../out
      - uses: actions/upload-artifact@v4
        if: matrix.runner == 'xcode-27' && steps.apps.outcome == 'success'
        with:
          name: mamay-native-${{ github.run_number }}
          path: out/*.zip
          retention-days: 14
      - name: Report to the private repo
        if: always()
        env:
          TOKEN: ${{ secrets.FORMLAB_CODE_TOKEN }}
        run: |
          SHA=$(git -C src rev-parse --short HEAD)
          R=report.md
          {
            echo "# Native CI · ${{ matrix.runner }} · $REF @ $SHA · run ${{ github.run_number }}"
            echo; echo "tests: ${{ steps.tests.outcome }} · apps: ${{ steps.apps.outcome }}"; echo
            echo "env: $(grep -m1 ProductVersion env.txt | awk '{print $2}') · $(grep -m1 '^Xcode' env.txt) · $(grep -m1 'Apple Swift version' env.txt | sed -E 's/.*(Apple Swift version [0-9.]+).*/\1/')"
            # errors only: compile errors, failed tests (not ✔, not known issues, not the golden table — that lives in out/golden/real.md)
            echo '## swift test — errors'; echo '```'
            grep -E "error:|✘|fatal" test.log | grep -vE "✔|known issue|^\| " | sort -u | head -60 || true
            tail -1 test.log; echo '```'
            # measures a test prints for the lead (speed of the grand run, bits per idea…)
            if grep -q "^MAMAY " test.log; then echo '## measures'; echo '```'; grep "^MAMAY " test.log | sort -u | head -40; echo '```'; fi
            # golden: only the sheets that fail, and what changed against the last report of this branch
            if [ -f ci-out/golden/real.md ]; then
              echo '## golden (✘ rows; Δ vs previous)'; echo '```'
              grep -E "^\| .* ✘ \|$" ci-out/golden/real.md | cut -d'|' -f2,5,6,7 | head -30
              grep -E "^Without paint" ci-out/golden/real.md || true
              echo '```'
            fi
            for f in build-*.log; do
              [ -f "$f" ] || continue
              echo "## $f"; echo '```'
              grep -E "error:|BUILD (SUCCEEDED|FAILED)|\*\* " "$f" | sort -u | head -60 || true
              echo '```'
            done
          } > $R
          rm -rf rep   # the self-hosted runner keeps its workspace: a clone left by the last run made every push since 02.11 00:38 fail
          git clone -q --depth 1 --branch native-ci-reports "https://x-access-token:${TOKEN}@github.com/m0k1mo/Formlab.git" rep 2>/dev/null || {
            git init -q rep && git -C rep checkout -q --orphan native-ci-reports && git -C rep remote add origin "https://x-access-token:${TOKEN}@github.com/m0k1mo/Formlab.git"; }
          mkdir -p rep/native-ci
          B=$(echo "${{ github.event.client_payload.branch || github.event.inputs.ref || 'manual' }}" | tr '/:' '__' | cut -c1-60)
          P="rep/native-ci/out/$B-${{ matrix.runner }}/golden/real.md"
          if [ -f ci-out/golden/real.md ] && [ -f "$P" ]; then
            { echo '## golden Δ vs previous run of this branch'; echo '```'
              diff <(grep -E "^\| " "$P" | cut -d'|' -f2,5,6) <(grep -E "^\| " ci-out/golden/real.md | cut -d'|' -f2,5,6) | grep -E "^[<>]" | head -40 || echo "(no change)"
              echo '```'; } >> $R
          fi
          cp $R "rep/native-ci/latest-$B-${{ matrix.runner }}.md"
          cp $R "rep/native-ci/$SHA-${{ matrix.runner }}.md"
          # files the tests wrote for the lead (golden tables, side-by-side pictures): native-ci/out/<branch>-<runner>/
          if [ -d ci-out ] && [ -n "$(ls -A ci-out)" ]; then
            O="rep/native-ci/out/$B-${{ matrix.runner }}"; rm -rf "$O"; mkdir -p "$O"
            find ci-out -type f -size -3M | head -300 | while read -r x; do mkdir -p "$O/$(dirname "${x#ci-out/}")"; cp "$x" "$O/${x#ci-out/}"; done
          fi
          # native/main and nothing worse: this run's numbers (the better of last and now) are the next baseline of the ratchet
          if [ "${{ github.event.client_payload.branch || github.event.inputs.ref }}" = "native/main" ] && [ -f ci-out/golden/golden-next.json ]; then
            cp ci-out/golden/golden-next.json "rep/native-ci/golden-last-${{ matrix.runner }}.json"
          fi
          cd rep && git config user.name "native-ci" && git config user.email "native-ci@users.noreply.github.com"
          git add -A && git commit -qm "native-ci ${{ matrix.runner }} $SHA" || exit 0
          for i in 1 2 3 4 5; do git push -q origin HEAD:native-ci-reports && break; git pull -q --rebase origin native-ci-reports || true; sleep 3; done
